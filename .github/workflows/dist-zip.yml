name: Build distribution zip

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  dist:
    # Pin until ubuntu-latest moves to 26.04 (2026-10-19〜). Matches hosted 24.04 images today.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint && npm run format:check

      - name: Test
        run: npm run test && npm run test:doctor

      - name: Build & zip
        run: npm run dist

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: s2j-acknowledgements-dist-zip
          path: release/*.zip
